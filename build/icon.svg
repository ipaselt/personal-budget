<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8385f2"/>
      <stop offset="1" stop-color="#5457d8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS-style rounded tile (824px content area, 185px corner radius) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Signature donut: white ring with one green savings segment -->
  <g fill="none" stroke-width="66" stroke-linecap="round">
    <circle cx="512" cy="512" r="228" stroke="#ffffff" stroke-opacity="0.92"/>
    <path d="M512 284 A228 228 0 0 1 729.9 583.4" stroke="#39d98a"/>
  </g>
</svg>
